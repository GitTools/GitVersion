name: Build (new-cli)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'
      - 'poc/*'
      - 'support/*'
      - 'next/*'
    paths:
      - '**'
      - '!docs/**'
      - '!.github/**'
      - .github/workflows/new-cli.yml

  pull_request:
    branches:
      - main
      - 'support/*'
      - 'next/*'

permissions:
  contents: read

env:
  DOTNET_ROLL_FORWARD: "Major"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  format:
    runs-on: ubuntu-24.04
    name: Build & Test (new-cli)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Required checks must report even when the PR only changes excluded paths.
      - name: Check relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_files"
          relevant=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/new-cli.yml) relevant=true ;;
              docs/*|.github/*) continue ;;
              *) relevant=true ;;
            esac
          done < "$changed_files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == false ]]; then
            echo "No relevant changes; the new CLI build and tests are not needed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup .NET SDK
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build 'new-cli' solution
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet build ./new-cli

      - name: Run Format 'new-cli' solution
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet format ./new-cli --exclude ~/.nuget/packages --verify-no-changes

      - name: Test 'new-cli' solution
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet test --solution ./new-cli/GitVersion.slnx --no-build --verbosity normal
