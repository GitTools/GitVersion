name: Build (new-cli)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'
      - 'poc/*'
      - 'support/*'
      - 'next/*'
    paths:
      - '**'
      - '!docs/**'
      - '!.github/**'
      - .github/workflows/new-cli.yml

  pull_request:
    branches:
      - main
      - 'support/*'
      - 'next/*'

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_ROLL_FORWARD: "Major"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  format:
    runs-on: ubuntu-24.04
    name: Build & Test (new-cli)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check for relevant changes
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - '!{docs,.github}/**'
              - '.github/workflows/new-cli.yml'

      - name: Checkout
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build 'new-cli' solution
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: dotnet build ./new-cli

      - name: Run Format 'new-cli' solution
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: dotnet format ./new-cli --exclude ~/.nuget/packages --verify-no-changes

      - name: Test 'new-cli' solution
        if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
        run: dotnet test --solution ./new-cli/GitVersion.slnx --no-build --verbosity normal
