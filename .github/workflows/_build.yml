on:
  workflow_call:
    inputs:
      build_matrix:
        description: 'Native packaging build matrix generated by Cake'
        required: true
        type: string

env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  DOTNET_ROLL_FORWARD: "Major"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.build_matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      - name: '[Build]'
        if: matrix.container == ''
        shell: pwsh
        run: dotnet run/build.dll --target=Package

      - name: Build native Linux packages
        if: matrix.container != ''
        shell: pwsh
        run: dotnet run/build.dll --target=PackageLinux --native_container=${{ matrix.container }}

      - name: 'Upload nuget packages'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'windows-2025-vs2026'
        with:
          name: nuget-${{ matrix.rid }}
          path: ${{ github.workspace }}/artifacts/packages/nuget

      - name: Upload RID-specific tool packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os != 'windows-2025-vs2026'
        with:
          name: nuget-${{ matrix.rid }}
          path: ${{ github.workspace }}/artifacts/packages/nuget/GitVersion.Tool.${{ matrix.rid }}.*.nupkg
          if-no-files-found: error

      - name: 'Upload native packages'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'windows-2025-vs2026'
        with:
          name: native-${{ matrix.artifact }}
          path: ${{ github.workspace }}/artifacts/packages/native/*.zip
          if-no-files-found: error

      - name: 'Upload native packages'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os != 'windows-2025-vs2026'
        with:
          name: native-${{ matrix.artifact }}
          path: ${{ github.workspace }}/artifacts/packages/native/*.tar.gz
          if-no-files-found: error

  collect:
    name: Collect platform packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      - name: Download platform NuGet packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuget-*
          merge-multiple: true
          path: artifacts/packages/nuget

      - name: Download Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-linux-*
          merge-multiple: true
          path: artifacts/packages/native

      - name: Validate collected packages
        shell: pwsh
        run: dotnet run/build.dll --target=PackageValidateCollected

      - name: Upload complete NuGet set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: artifacts/packages/nuget

      - name: Upload complete Linux archive set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-Linux
          path: artifacts/packages/native
          if-no-files-found: error
