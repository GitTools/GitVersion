on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
      docker_distros:
        required: true
        type: string
      dotnet_versions:
        required: true
        type: string
      publish_images:
        required: true
        type: boolean
      dockerhub_oidc_connection_id:
        required: true
        type: string

env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  DOTNET_ROLL_FORWARD: "Major"

jobs:
  test:
    name: ${{ matrix.docker_distro }} - net${{ matrix.dotnet_version }}
    if: inputs.publish_images == false
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        docker_distro: ${{ fromJson(inputs.docker_distros) }}
        dotnet_version: ${{ fromJson(inputs.dotnet_versions) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        name: Download nuget packages
        with:
          name: nuget
          path: ${{ github.workspace }}/artifacts/packages/nuget

      - name: Set up Docker
        uses: $/.github/actions/docker-setup # NOSONAR -- $/ resolves to the running commit.

      # Run both backends concurrently in the same job (GitHub Actions parallel steps).
      # Each uses an ephemeral --rm container, so the two runs don't interfere.
      - name: Docker Test (libgit2)
        if: success() && inputs.publish_images == false
        background: true
        uses: $/.github/actions/docker-test # NOSONAR -- $/ resolves to the running commit.
        with:
          arch: ${{ inputs.arch }}
          docker_distro: ${{ matrix.docker_distro }}
          dotnet_version: ${{ matrix.dotnet_version }}
          git_backend: libgit2

      - name: Docker Test (managed)
        if: success() && inputs.publish_images == false
        background: true
        uses: $/.github/actions/docker-test # NOSONAR -- $/ resolves to the running commit.
        with:
          arch: ${{ inputs.arch }}
          docker_distro: ${{ matrix.docker_distro }}
          dotnet_version: ${{ matrix.dotnet_version }}
          git_backend: managed

      - name: Wait for docker backend tests
        wait-all:

  publish:
    name: ${{ matrix.docker_distro }} - net${{ matrix.dotnet_version }}
    if: inputs.publish_images
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        docker_distro: ${{ fromJson(inputs.docker_distros) }}
        dotnet_version: ${{ fromJson(inputs.dotnet_versions) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        name: Download nuget packages
        with:
          name: nuget
          path: ${{ github.workspace }}/artifacts/packages/nuget

      - name: Set up Docker
        uses: $/.github/actions/docker-setup # NOSONAR -- $/ resolves to the running commit.

      - name: Docker Publish
        uses: $/.github/actions/docker-publish # NOSONAR -- $/ resolves to the running commit.
        with:
          arch: ${{ inputs.arch }}
          docker_distro: ${{ matrix.docker_distro }}
          dotnet_version: ${{ matrix.dotnet_version }}
          dockerhub_organization: gittools
          dockerhub_oidc_connection_id: ${{ inputs.dockerhub_oidc_connection_id }}
          github_registry_username: ${{ github.repository_owner }}
          github_registry_password: ${{ github.token }}
