name: Markdown Update

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'

  pull_request:
    branches:
      - main
      - 'support/*'
      - 'next/*'
    paths:
      - 'docs/**'

env:
  DOTNET_ROLL_FORWARD: "Major"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

defaults:
  run:
    shell: pwsh

jobs:
  docs:
    name: Update Markdown (embedded snippets)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: gittools/cicd/checkout@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run MarkdownSnippets
        run: |
          dotnet tool install --global MarkdownSnippets.Tool
          mdsnippets --write-header false
        working-directory: ${{ github.workspace }}/docs/input

      - name: Commit and push markdown docs changes
        uses: gittools/cicd/git-commit-push@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          message: "include markdown docs changes"
