name: MTP annotation forwarding
on:
  pull_request:
    paths:
      - .github/workflows/mtp-forwarding.yml
      - .github/scripts/check-mtp-forwarding.py
      - tests/mtp-forwarding/**
      - build/build/Tasks/Test/**
      - src/Directory.Packages.props
      - global.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Forwarding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Compare runners and validate reports
        run: python .github/scripts/check-mtp-forwarding.py
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mtp-forwarding-${{ matrix.os }}
          path: ${{ runner.temp }}/mtp-forwarding
          if-no-files-found: error
          retention-days: 7
  verify:
    name: Verify hosted annotations
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify annotations accepted by GitHub
        run: python .github/scripts/check-mtp-forwarding.py --verify-hosted
        env:
          GH_TOKEN: ${{ github.token }}
