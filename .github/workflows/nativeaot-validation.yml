name: NativeAOT validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build/nativeaot*'
      - 'build/nativeaot*/**'
      - 'build/publish-nativeaot.ps1'
      - 'global.json'
      - '.github/workflows/nativeaot-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.target.rid }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
        target:
          - {rid: win-x64, runner: windows-2025-vs2026, arch: x64, libc: none}
          - {rid: win-arm64, runner: windows-11-vs2026-arm, arch: arm64, libc: none}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      FRAMEWORK: ${{ matrix.framework }}
      RID: ${{ matrix.target.rid }}
      RUNTIME_VERSION: ${{ matrix.framework == 'net10.0' && '10.0.13' || '11.0.0-rc.2.26504.105' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout exact validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select isolated validation output
        shell: pwsh
        run: |
          # Server Core only has C:. Keep installed tool paths identical inside it.
          $base = if ($IsWindows) { 'C:\nativeaot-validation' } else { $env:RUNNER_TEMP }
          $directory = Join-Path $base ('nativeaot-{0}-{1}' -f $env:RID, $env:FRAMEWORK)
          "NATIVE_OUTPUT=$directory" >> $env:GITHUB_ENV

      - name: Setup Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.target.arch }}

      - name: Setup pinned SDK
        if: runner.os != 'Linux'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.402'

      - name: Publish and execute target-host parity
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          python build/nativeaot-validation-tests.py
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT validation regression checks failed.' }
          python build/nativeaot-platform-validation.py --framework $env:FRAMEWORK --rid $env:RID --runtime-version $env:RUNTIME_VERSION --output $env:NATIVE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT target-host validation failed.' }
          python build/nativeaot-capture-validation.py --platform-output $env:NATIVE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT pipe-capture validation failed.' }
          python build/nativeaot-tool-validation.py --platform-output $env:NATIVE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT native-tool validation failed.' }

      - name: Publish and execute Linux baseline parity on native CPU
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBC: ${{ matrix.target.libc }}
        run: |
          dockerfile=build/nativeaot-build.Dockerfile
          if [ "$LIBC" = glibc ]; then dockerfile=build/nativeaot-glibc-build.Dockerfile; fi
          docker build -f "$dockerfile" -t nativeaot-linux-build .
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/source" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w /source \
            -e FRAMEWORK -e RID -e RUNTIME_VERSION -e NATIVE_OUTPUT -e PYTHONUTF8 -e PYTHONIOENCODING \
            -e HOME=/tmp/nativeaot-home nativeaot-linux-build \
            sh -ec 'mkdir -p "$HOME"; python3 build/nativeaot-validation-tests.py; python3 build/nativeaot-platform-validation.py --framework "$FRAMEWORK" --rid "$RID" --runtime-version "$RUNTIME_VERSION" --output "$NATIVE_OUTPUT"; python3 build/nativeaot-capture-validation.py --platform-output "$NATIVE_OUTPUT"; python3 build/nativeaot-tool-validation.py --platform-output "$NATIVE_OUTPUT"'
          docker image inspect nativeaot-linux-build > "$NATIVE_OUTPUT/evidence/build-image.json"

      - name: Run standalone and installed tools without .NET in containers
        if: runner.os == 'Linux' || matrix.target.rid == 'win-x64'
        shell: pwsh
        run: |
          $python = if ($IsLinux) { 'python3' } else { 'python' }
          & $python build/nativeaot-container-validation.py --platform-output $env:NATIVE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT container execution failed.' }

      - name: Run with hosted macOS SDK and shared runtime contents unavailable
        if: runner.os == 'macOS'
        shell: pwsh
        env:
          NATIVEAOT_EPHEMERAL_RUNNER: ${{ runner.environment }}
        run: |
          python build/nativeaot-hosted-isolation.py --platform-output $env:NATIVE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT hosted runtime isolation failed.' }

      - name: Retain validation evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativeaot-evidence-${{ matrix.target.rid }}-${{ matrix.framework }}
          path: ${{ env.NATIVE_OUTPUT }}/evidence/
          if-no-files-found: warn
          retention-days: 7
