name: Mark public API as shipped

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ publish-release ]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  public-api:
    name: Mark public API as shipped
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: gittools/cicd/checkout@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          fetch-depth: 0

      - name: Mark public API as shipped
        run: ./src/mark-shipped.ps1

      - name: Commit and push changes
        uses: gittools/cicd/git-commit-push@35132578146a11af8758159e9a9d4f69c7041297 # v6
        with:
          message: "include public API changes"
