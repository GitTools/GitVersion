# Temporary #5221 proof: no token, scanner end, or SonarCloud configuration changes.
on:
  workflow_call:

permissions:
  contents: read

env:
  SCANNER_VERSION: '11.3.0'
  PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PROOF_PR: ${{ github.event.pull_request.number }}
  DOTNET_ROLL_FORWARD: Major
  PYTHONDONTWRITEBYTECODE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: Anonymous Sonar build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Validate handoff helper
        run: python3 -m unittest discover -s .github/scripts -p 'test_sonar_proof.py' -v
      - name: Install pinned scanner outside the checkout
        run: dotnet tool install dotnet-sonarscanner --version "$SCANNER_VERSION" --tool-path "$RUNNER_TEMP/sonar-tool"
      - name: Prepare and compile analysis without credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sonar-logs"
          "$RUNNER_TEMP/sonar-tool/dotnet-sonarscanner" begin \
            /k:GitTools_GitVersion /o:gittools \
            /d:sonar.host.url=https://sonarcloud.io \
            /d:sonar.userHome="$RUNNER_TEMP/sonar-cache" \
            /d:sonar.exclusions='build/common/Addins/**/*,.devagent/**' \
            /d:sonar.scm.revision="$GITHUB_SHA" \
            2>&1 | tee "$RUNNER_TEMP/sonar-logs/begin.log"
          for solution in src/GitVersion.slnx new-cli/GitVersion.slnx build/CI.slnx; do
            dotnet build "$solution" --configuration Release --no-incremental \
              -p:ContinuousIntegrationBuild=false \
              2>&1 | tee -a "$RUNNER_TEMP/sonar-logs/build.log"
          done
      - name: Download this attempt's canonical coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-ubuntu-24.04-net10.0-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-coverage
      - name: Collect and inspect data-only handoff
        run: |
          python3 .github/scripts/sonar_proof.py collect \
            --scanner .sonarqube \
            --coverage "$RUNNER_TEMP/canonical-coverage/managed/attempt-$GITHUB_RUN_ATTEMPT" \
            --bundle "$RUNNER_TEMP/sonar-bundle"
      - name: Upload proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-bundle
          if-no-files-found: error
          retention-days: 7
      - name: Preserve scanner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-proof-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-logs
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Verify Sonar handoff
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-bundle
      - name: Verify identity, integrity, scope and coverage mapping
        run: python3 .github/scripts/sonar_proof.py verify --bundle "$RUNNER_TEMP/sonar-bundle"
