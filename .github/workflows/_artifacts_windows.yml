on:
  workflow_call:
    inputs:
      packages:
        required: true
        type: string

env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  DOTNET_ROLL_FORWARD: "Major"

jobs:
  artifacts:
    name: ${{ matrix.package }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        name: Download nuget packages
        with:
          name: nuget
          path: ${{ github.workspace }}/artifacts/packages/nuget

      # In-process tests share a single package install directory, so the two backends
      # run sequentially here (not as parallel background steps).
      - name: '[Test Artifacts] (libgit2)'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GITVERSION_GIT_BACKEND: libgit2
        with:
          shell: pwsh
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: dotnet run/artifacts.dll --target=Artifacts${{ matrix.package }}Test

      - name: '[Test Artifacts] (managed)'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GITVERSION_GIT_BACKEND: managed
        with:
          shell: pwsh
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: dotnet run/artifacts.dll --target=Artifacts${{ matrix.package }}Test
