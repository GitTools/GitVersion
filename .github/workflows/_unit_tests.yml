on:
  workflow_call:
    inputs:
      dotnet_versions:
        required: true
        type: string
      publish_coverage:
        required: true
        type: boolean
env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  DOTNET_ROLL_FORWARD: "Major"

permissions:
  contents: read

jobs:
  unit_test:
    name: ${{ matrix.os }} - net${{ matrix.dotnet_version }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025-vs2026, ubuntu-24.04, macos-26 ]
        dotnet_version: ${{ fromJson(inputs.dotnet_versions) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TEST_RESULTS: ${{ github.workspace }}/artifacts/test-results/attempt-${{ github.run_attempt }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      # One attempt: retries leave stale failure annotations after a later pass.
      - name: '[Unit Test]'
        id: unit_tests
        timeout-minutes: 30
        shell: bash
        run: |
          # Explicit bash uses pipefail on every runner. Keep the log outside Cake's Clean target.
          preserve_reports() {
            if [[ -n "${stack_watcher:-}" ]]; then
              kill "$stack_watcher" 2>/dev/null || true
            fi
            mkdir -p "$TEST_RESULTS"
            cp "$RUNNER_TEMP/unit-tests.log" "$TEST_RESULTS/test.log"
            if [[ -f "$GITHUB_STEP_SUMMARY" ]]; then
              cp "$GITHUB_STEP_SUMMARY" "$TEST_RESULTS/summary.md"
            fi
          }
          trap preserve_reports EXIT
          # Disposable macOS/net10 timeout diagnosis; never transfer this hook to the PR.
          if [[ "${{ matrix.os }}" == "macos-26" && "${{ matrix.dotnet_version }}" == "10.0" ]]; then
            mkdir -p "$TEST_RESULTS"
            if dotnet tool install dotnet-stack --tool-path "$RUNNER_TEMP/stack-tools" > "$TEST_RESULTS/stack-install.log" 2>&1; then
              (
                sleep 900
                ps -axo pid=,command= > "$TEST_RESULTS/processes-at-snapshot.txt"
                core_pid=$(awk '$2 ~ /(^|\/)dotnet$/ && $3 == "exec" && $4 ~ /\/GitVersion.Core.Tests.dll$/ {print $1; exit}' "$TEST_RESULTS/processes-at-snapshot.txt")
                if [[ -n "$core_pid" ]]; then
                  "$RUNNER_TEMP/stack-tools/dotnet-stack" report -p "$core_pid" > "$TEST_RESULTS/core-stacks.txt" 2>&1 || true
                else
                  echo 'Core test process not found at snapshot time.' > "$TEST_RESULTS/core-stacks.txt"
                fi
              ) &
              stack_watcher=$!
            fi
          fi
          dotnet run/build.dll --target=UnitTest --dotnet_version=${{ matrix.dotnet_version }} --test_results="$TEST_RESULTS" \
            2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Explain failed or incomplete test run
        if: always() && steps.unit_tests.outcome != 'success'
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          {
            echo '### Unit-test job did not complete successfully'
            printf 'Test step outcome: **%s**.\n\n' "$TEST_OUTCOME"
            echo 'Project summaries describe completed test runs only. A build or host failure may leave other projects untested.'
            echo 'Missing reports do not mean tests passed. See the job log and available test-results artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$TEST_RESULTS"
          cat "$GITHUB_STEP_SUMMARY" >> "$TEST_RESULTS/summary.md"

      - name: Preserve test reports and log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}-net${{ matrix.dotnet_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Test Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() && inputs.publish_coverage && matrix.dotnet_version == '10.0' }}
        with:
          files: artifacts/test-results/**/results.xml
          report_type: 'test_results'
          use_oidc: true

      - name: Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() && inputs.publish_coverage && matrix.dotnet_version == '10.0'
        with:
          directory: artifacts/test-results
          report_type: 'coverage'
          use_oidc: true
