on:
  workflow_call:
    inputs:
      dotnet_versions:
        required: true
        type: string
      publish_coverage:
        required: true
        type: boolean
env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  DOTNET_ROLL_FORWARD: "Major"

permissions:
  contents: read

jobs:
  unit_test:
    name: ${{ matrix.os }} - net${{ matrix.dotnet_version }} - ${{ matrix.git_backend }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025-vs2026, ubuntu-24.04, macos-26 ]
        dotnet_version: ${{ fromJson(inputs.dotnet_versions) }}
        # Run the suite against both Git backends until libgit2 is removed,
        # see https://github.com/GitTools/GitVersion/issues/5031
        git_backend: [ libgit2, managed ]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SONAR_PRODUCER: ${{ github.repository == 'GitTools/GitVersion' && (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'ubuntu-24.04' && matrix.dotnet_version == '10.0' && matrix.git_backend == 'managed' }}
      GITVERSION_GIT_BACKEND: ${{ matrix.git_backend }}
      TEST_RESULTS: ${{ github.workspace }}/artifacts/test-results/${{ matrix.git_backend }}/attempt-${{ github.run_attempt }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      - name: Prepare anonymous Sonar analysis
        if: env.SONAR_PRODUCER == 'true'
        shell: bash
        run: |
          dotnet tool restore
          # Sonar otherwise conflates projects such as src/new-cli GitVersion.Core.
          targets="$RUNNER_TEMP/sonar-projects.targets"
          echo '<Project><PropertyGroup>' > "$targets"
          while IFS= read -r project; do
            [[ "$project" =~ ^[a-zA-Z0-9_./-]+$ ]]
            digest=$(printf '%s' "$project" | sha256sum)
            guid="${digest:0:8}-${digest:8:4}-${digest:12:4}-${digest:16:4}-${digest:20:12}"
            # MSBuild evaluates the literal property later.
            # shellcheck disable=SC2016
            printf '<ProjectGuid Condition="\x27$(MSBuildProjectFullPath)\x27 == \x27%s/%s\x27">%s</ProjectGuid>\n' "$GITHUB_WORKSPACE" "$project" "$guid" >> "$targets"
          done < <(git ls-files 'src/**/*.csproj' 'new-cli/**/*.csproj' 'build/**/*.csproj')
          echo '</PropertyGroup></Project>' >> "$targets"
          echo "CustomAfterMicrosoftCommonTargets=$RUNNER_TEMP/sonar-projects.targets" >> "$GITHUB_ENV"
          dotnet tool run dotnet-sonarscanner begin /k:GitTools_GitVersion /o:gittools \
            /d:sonar.host.url=https://sonarcloud.io \
            /d:sonar.exclusions='build/common/Addins/**/*,.devagent/**' \
            /d:sonar.scm.revision="$GITHUB_SHA"

      # One attempt: retries leave stale failure annotations after a later pass.
      - name: '[Unit Test]'
        id: unit_tests
        timeout-minutes: 30
        shell: bash
        run: |
          # Explicit bash uses pipefail on every runner. Keep the log outside Cake's Clean target.
          preserve_reports() {
            mkdir -p "$TEST_RESULTS"
            cp "$RUNNER_TEMP/unit-tests.log" "$TEST_RESULTS/test.log"
            if [[ -f "$GITHUB_STEP_SUMMARY" ]]; then
              cp "$GITHUB_STEP_SUMMARY" "$TEST_RESULTS/summary.md"
            fi
          }
          trap preserve_reports EXIT
          dotnet run/build.dll --target=UnitTest --dotnet_version=${{ matrix.dotnet_version }} --test_results="$TEST_RESULTS" \
            2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Analyze remaining solutions
        if: env.SONAR_PRODUCER == 'true'
        shell: bash
        run: |
          for solution in new-cli/GitVersion.slnx build/CI.slnx; do
            dotnet build "$solution" --configuration Release --no-incremental --disable-build-servers \
              -p:ContinuousIntegrationBuild=false
          done
      - name: Package Sonar analysis data
        if: env.SONAR_PRODUCER == 'true'
        shell: pwsh
        run: |
          ./.github/scripts/sonar-handoff.ps1 -Mode Pack -Workspace $env:GITHUB_WORKSPACE -Bundle "$env:RUNNER_TEMP/sonar-bundle"
      - name: Upload canonical Sonar build data
        if: env.SONAR_PRODUCER == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-analysis-ubuntu-24.04-net10.0-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Explain failed or incomplete test run
        if: always() && steps.unit_tests.outcome != 'success'
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          {
            echo '### Unit-test job did not complete successfully'
            printf 'Test step outcome: **%s**.\n\n' "$TEST_OUTCOME"
            echo 'Project summaries describe completed test runs only. A build or host failure may leave other projects untested.'
            echo 'Missing reports do not mean tests passed. See the job log and available test-results artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$TEST_RESULTS"
          cat "$GITHUB_STEP_SUMMARY" >> "$TEST_RESULTS/summary.md"

      - name: Preserve test reports and log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}-net${{ matrix.dotnet_version }}-${{ matrix.git_backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Test Results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() && inputs.publish_coverage && matrix.dotnet_version == '10.0' }}
        with:
          files: artifacts/test-results/**/results.xml
          report_type: 'test_results'
          flags: ${{ matrix.git_backend }}
          use_oidc: true

      - name: Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success() && inputs.publish_coverage && matrix.dotnet_version == '10.0'
        with:
          directory: artifacts/test-results
          report_type: 'coverage'
          flags: ${{ matrix.git_backend }}
          use_oidc: true
