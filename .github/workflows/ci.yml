name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Upstream PR number whose code has been reviewed
        required: true
        type: string
      head_sha:
        description: Full reviewed PR head SHA (build and tests run with Sonar credentials)
        required: true
        type: string

  push:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'
      - 'poc/*'
      - 'support/*'
      - 'next/*'
    paths:
      - '**'
      - '!docs/**'

  pull_request:
    branches:
      - main
      - 'support/*'
      - 'next/*'
    paths:
      - '**'
      - '!docs/**'
  merge_group:
    types: [ checks_requested ]

  repository_dispatch:
    types: [ ci-release ]

env:
  DOTNET_ROLL_FORWARD: "Major"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

  ENABLED_DIAGNOSTICS: ${{ vars.ENABLED_DIAGNOSTICS }}

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar reviewed PR proof
    if: github.event_name == 'workflow_dispatch' && github.repository == 'GitTools/GitVersion' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    env:
      GITVERSION_GIT_BACKEND: managed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check reviewed PR identity and analysis mode
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/GitTools/GitVersion/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          jq -e --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha and .base.repo.full_name == "GitTools/GitVersion"' "$RUNNER_TEMP/pr.json"
          jq -r '"branch=" + .head.ref, "base=" + .base.ref' "$RUNNER_TEMP/pr.json" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error 'https://sonarcloud.io/api/settings/values?component=GitTools_GitVersion&keys=sonar.autoscan.enabled' |
            jq -e 'any(.settings[]; .key == "sonar.autoscan.enabled" and .value == "false")'
      - name: Checkout explicitly reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      - name: Distinguish same-named projects across solutions
        shell: bash
        run: |
          # Sonar otherwise conflates projects such as src/new-cli GitVersion.Core.
          targets="$RUNNER_TEMP/sonar-projects.targets"
          echo '<Project><PropertyGroup>' > "$targets"
          while IFS= read -r project; do
            [[ "$project" =~ ^[a-zA-Z0-9_./-]+$ ]]
            digest=$(printf '%s' "$project" | sha256sum)
            guid="${digest:0:8}-${digest:8:4}-${digest:12:4}-${digest:16:4}-${digest:20:12}"
            # MSBuild evaluates the literal property later.
            # shellcheck disable=SC2016
            printf '<ProjectGuid Condition="\x27$(MSBuildProjectFullPath)\x27 == \x27%s/%s\x27">%s</ProjectGuid>\n' "$GITHUB_WORKSPACE" "$project" "$guid" >> "$targets"
          done < <(git ls-files 'src/**/*.csproj' 'new-cli/**/*.csproj' 'build/**/*.csproj')
          echo '</PropertyGroup></Project>' >> "$targets"
      - name: Load Sonar analysis token
        id: sonar
        uses: 1password/load-secrets-action@14f2fed3712a25f8ad8916ddcca3c4ed737810f6 # v3
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SONAR_TOKEN: op://gittools/ci/sonarcloud/token
      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.SONAR_TOKEN }}
          PR: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_BASE: ${{ steps.pr.outputs.base }}
        run: |
          dotnet sonarscanner begin /k:GitTools_GitVersion /o:gittools \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url=https://sonarcloud.io \
            /d:sonar.pullrequest.key="$PR" \
            /d:sonar.pullrequest.branch="$PR_BRANCH" \
            /d:sonar.pullrequest.base="$PR_BASE" \
            /d:sonar.scm.revision="$HEAD_SHA" \
            /d:sonar.cs.opencover.reportsPaths="$RUNNER_TEMP/sonar-coverage/**/*opencover*.xml" \
            /d:sonar.exclusions='build/common/Addins/**/*,.devagent/**' \
            /d:sonar.qualitygate.wait=true
      - name: Build all three solutions with analysis
        run: |
          for solution in src/GitVersion.slnx new-cli/GitVersion.slnx build/CI.slnx; do
            dotnet build "$solution" --configuration Release --no-incremental --disable-build-servers \
              -p:ContinuousIntegrationBuild=false \
              -p:CustomAfterMicrosoftCommonTargets="$RUNNER_TEMP/sonar-projects.targets"
          done
      - name: Run tests and collect OpenCover reports
        shell: bash
        run: |
          for project in src/*.Tests/*.csproj; do
            name=$(basename "$project" .csproj)
            results="$RUNNER_TEMP/sonar-coverage/$name"
            dotnet test --project "$project" --configuration Release --no-build \
              --coverlet --coverlet-output-format opencover \
              --coverlet-exclude '[GitVersion*.Tests]*' \
              --coverlet-exclude '[GitVersion.Testing]*' \
              --coverlet-exclude '[Spekt.TestLogger]*' \
              --results-directory "$results"
            compgen -G "$results/*opencover*.xml" > /dev/null
          done
      - name: Confirm PR head is still current
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          gh api "repos/GitTools/GitVersion/pulls/$PR" |
            jq -e --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha'
      - name: End analysis and wait for quality gate
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: Preserve coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-opencover-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-coverage
          if-no-files-found: warn
          retention-days: 7

  prepare:
    if: github.event_name != 'workflow_dispatch'
    name: Prepare
    permissions:
      contents: read
    uses: $/.github/workflows/_prepare.yml # NOSONAR -- $/ resolves to the running commit.

  publish_flags:
    if: github.event_name != 'workflow_dispatch'
    name: Publish Flags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      can_publish: ${{ steps.flags.outputs.can_publish }}
      run_full_validation: ${{ steps.flags.outputs.run_full_validation }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve publish flag
        id: flags
        shell: bash
        run: |
          echo "can_publish=${{ github.repository == 'GitTools/GitVersion' && github.ref_name == 'main' }}" >> "$GITHUB_OUTPUT"
          echo "run_full_validation=${{ github.repository == 'GitTools/GitVersion' && (github.ref_name == 'main' || github.event_name == 'merge_group' || github.event_name == 'repository_dispatch') }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Package
    needs: [ prepare ]
    permissions:
      contents: read
    uses: $/.github/workflows/_build.yml # NOSONAR -- $/ resolves to the running commit.

  unit_test:
    name: Test
    needs: [ prepare, publish_flags ]
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/_unit_tests.yml # NOSONAR -- $/ resolves to the running commit.
    with:
      dotnet_versions: ${{ needs.prepare.outputs.dotnet_versions }}
      publish_coverage: ${{ fromJson(needs.publish_flags.outputs.can_publish) }}

  artifacts_windows_test:
    name: Artifacts Windows
    needs: [ build, publish_flags ]
    permissions:
      contents: read
    uses: $/.github/workflows/_artifacts_windows.yml # NOSONAR -- $/ resolves to the running commit.
    with:
      packages: ${{ fromJson(needs.publish_flags.outputs.run_full_validation) && '["Executable", "MsBuildFull"]' || '["Executable"]' }}

  artifacts_linux_test:
    needs: [ prepare, build, publish_flags ]
    name: Artifacts Linux (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: $/.github/workflows/_artifacts_linux.yml # NOSONAR -- $/ resolves to the running commit.
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      docker_distros: ${{ fromJson(needs.publish_flags.outputs.run_full_validation) && needs.prepare.outputs.docker_distros || '["ubuntu.24.04"]' }}
      dotnet_versions: ${{ needs.prepare.outputs.dotnet_versions }}

  docker_linux_images:
    needs: [ prepare, build, publish_flags ]
    name: Docker Images (${{ matrix.arch }})
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    uses: $/.github/workflows/_docker.yml # NOSONAR -- $/ resolves to the running commit.
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      docker_distros: ${{ fromJson(needs.publish_flags.outputs.run_full_validation) && needs.prepare.outputs.docker_distros || '["ubuntu.24.04"]' }}
      dotnet_versions: ${{ needs.prepare.outputs.dotnet_versions }}
      publish_images: ${{ fromJson(needs.publish_flags.outputs.can_publish) }}
      dockerhub_oidc_connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

  docker_linux_manifests:
    needs: [ prepare, docker_linux_images, publish_flags ]
    name: Docker Manifests
    if: fromJson(needs.publish_flags.outputs.can_publish)
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: $/.github/workflows/_docker_manifests.yml # NOSONAR -- $/ resolves to the running commit.
    with:
      docker_distros: ${{ needs.prepare.outputs.docker_distros }}
      dotnet_versions: ${{ needs.prepare.outputs.dotnet_versions }}
      publish_manifests: ${{ fromJson(needs.publish_flags.outputs.can_publish) }}
      dockerhub_oidc_connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

  publish:
    name: Publish
    needs: [ artifacts_windows_test, artifacts_linux_test, publish_flags ]
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: $/.github/workflows/_publish.yml # NOSONAR -- $/ resolves to the running commit.
    with:
      publish_packages: ${{ fromJson(needs.publish_flags.outputs.can_publish) }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  release:
    name: Release
    needs: [ publish, docker_linux_manifests ]
    if: ${{ always() && needs.publish.result == 'success' && (needs.docker_linux_manifests.result == 'success' || needs.docker_linux_manifests.result == 'skipped') }}
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CAN_PUBLISH: ${{ github.event_name == 'repository_dispatch' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore State
        uses: $/.github/actions/cache-restore # NOSONAR -- $/ resolves to the running commit.

      - name: Restore Artifacts
        uses: $/.github/actions/artifacts-restore # NOSONAR -- $/ resolves to the running commit.

      - name: Attestation
        if: env.CAN_PUBLISH == 'true'
        uses: $/.github/actions/artifacts-attest # NOSONAR -- $/ resolves to the running commit.

      - name: Load DockerHub credentials
        id: dockerhub-creds
        if: env.CAN_PUBLISH == 'true'
        uses: gittools/cicd/dockerhub-creds@824c3d773fb5d1b00c26b474ae88b7ce9ae555ee # v5
        with:
          op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: DockerHub Publish Readme
        if: env.CAN_PUBLISH == 'true'
        shell: pwsh
        run: dotnet run/docker.dll --target=DockerHubReadmePublish
        env:
          DOCKER_USERNAME: ${{ steps.dockerhub-creds.outputs.docker_username }}
          DOCKER_PASSWORD: ${{ steps.dockerhub-creds.outputs.docker_password }}

      - name: '[Release]'
        shell: pwsh
        run: dotnet run/release.dll --target=PublishRelease

      - name: '[Publish Release]'
        if: github.event_name == 'repository_dispatch'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          event-type: publish-release
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "tag": "${{ github.event.client_payload.tag }}"
            }
